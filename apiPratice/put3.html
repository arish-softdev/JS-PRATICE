<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUT In JavaScript</title>
</head>
<body>
    <div class="box">
        <h2>PUT in JavaScript</h2>
        <div id="cardbox" class="cards"></div>
        <div class="formbox" id="updateform">
            <h3>Update Task</h3>
            <form id="form">
                <input type="text" name="name" id="editname" placeholder="Name" />
                <input type="email" name="email" id="editemail" placeholder="Email" />
                <input type="tel" name="phone" id="editphone" placeholder="Phone" />
                <button type="submit">Update Task</button>
            </form>
        </div>
    </div>
</body>
<script src="./put2.js"></script>
</html>
